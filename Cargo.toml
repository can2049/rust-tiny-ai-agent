[package]
name = "tiny_ai_agent"
version = "0.1.0"
edition = "2024"
description = "一个从零实现的命令行 AI agent（学习项目）"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dotenvy = "0.15"